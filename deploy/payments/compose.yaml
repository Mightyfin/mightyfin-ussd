name: mightyfin-ussd-payments
services:
  payments:
    image: mightyfin/admin-lms:product-filter-groups-20261012
    entrypoint: ["php", "-S", "0.0.0.0:8080", "/ussd/router.php"]
    working_dir: /var/www/html
    restart: unless-stopped
    env_file:
      - /home/mightyfin/.config/mightyfin/admin-lms/.env
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
      APP_DEBUG: "false"
      APP_URL: "https://admin.mightyfinance.co.zm"
    ports:
      - "127.0.0.1:28094:8080"
    volumes:
      - ./:/ussd:ro
    networks:
      - lms
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  lms:
    external: true
    name: admin-lms_default
